spring.application.name=demo-boot

# Health check: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Show per-component status (diskSpace, ping, livenessState, ...) and their details
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.health.diskspace.enabled=false

# MySQL (override with DB_URL / DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
